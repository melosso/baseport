version: 2
updates:
  - package-ecosystem: nuget
    directory: /Source
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # The client targets net8.0; a newer major forces consumers onto newer Microsoft.Extensions packages.
      - dependency-name: Microsoft.Extensions.Http
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
